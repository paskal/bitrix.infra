# format: https://dnsrobocert.readthedocs.io/en/latest/user_guide.html#configuration
acme:
  email_account: ${EMAIL}
  staging: false
profiles:
  - name: ${PROVIDER}
    provider: ${PROVIDER}
    # a DNS provider that authenticates with one static API token (DigitalOcean, Cloudflare and
    # others): the token goes into AUTH_KEY in private/environment/dnsrobocert.env
    provider_options:
      auth_token: ${AUTH_KEY}
certificates:
  - profile: ${PROVIDER}
    domains:
      - "*.${DOMAIN}"
      - "${DOMAIN}"
      - "*.cdn-${DOMAIN}"
      - "cdn-${DOMAIN}"
    autorestart:
      - containers:
          - nginx

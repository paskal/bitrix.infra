zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 95618eb1474e44ac91b00d5c9bc7e33a
      name: Favor-group
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 1c218e00c1ad4ab9b3d3260a75cd69de
      template: 'Favor-group site monitoring'
      name: 'Favor-group site monitoring'
      templates:
        - name: 'Favor-group subdomain monitoring'
        - name: 'Favor-group www redirect working'
      groups:
        - name: Favor-group
        - name: Templates
      items:
        - uuid: 6e2520965d3547d88a91370819ad48ac
          name: 'Domain registration days left: {HOST.HOST}'
          type: EXTERNAL
          key: 'ssl_cert_check.sh[domain,"{HOST.HOST}",,,15]'
          delay: 6h
          history: 90d
          value_type: FLOAT
          units: '!d'
          description: 'Days until the registration of {HOST.HOST} expires, from whois (paid-till for .ru), via the domain mode of ssl_cert_check.sh on the Zabbix server. -65535 when whois gave no answer or no date.'
          tags:
            - tag: Application
              value: Web
          triggers:
            - uuid: fb7eee4305704b8eb2dee73670294daf
              expression: 'last(/Favor-group site monitoring/ssl_cert_check.sh[domain,"{HOST.HOST}",,,15])<{$DOMAIN.EXPIRE.WARN} and last(/Favor-group site monitoring/ssl_cert_check.sh[domain,"{HOST.HOST}",,,15])<>-65535'
              name: 'Domain {HOST.HOST} expires in {ITEM.VALUE}'
              priority: HIGH
              description: 'The domain registration runs out soon, and with it the site and its mail. Renew it at the registrar; check the date with whois {HOST.HOST}.'
              tags:
                - tag: notify
                  value: admin
            - uuid: e47252582ffe4a2c816d20ad9d2e52f5
              expression: 'max(/Favor-group site monitoring/ssl_cert_check.sh[domain,"{HOST.HOST}",,,15],#4)=-65535'
              name: 'Domain expiry of {HOST.HOST} could not be read for a day'
              priority: WARNING
              description: 'whois returned no answer or no expiry date four times in a row (24 hours), so the registration date is not watched. Run the check by hand on the Zabbix server: ssl_cert_check.sh domain {HOST.HOST}.'
              tags:
                - tag: notify
                  value: admin
        - uuid: f81bfcc0b1a047949f1adeb1720b8cf7
          name: 'Domain registration days left: cdn-{HOST.HOST}'
          type: EXTERNAL
          key: 'ssl_cert_check.sh[domain,"cdn-{HOST.HOST}",,,15]'
          delay: 6h
          history: 90d
          value_type: FLOAT
          units: '!d'
          description: 'Days until the registration of cdn-{HOST.HOST} expires, from whois (paid-till for .ru), via the domain mode of ssl_cert_check.sh on the Zabbix server. -65535 when whois gave no answer or no date.'
          tags:
            - tag: Application
              value: Web
          triggers:
            - uuid: f6c83aa455d64a72aa423371a356ec5e
              expression: 'last(/Favor-group site monitoring/ssl_cert_check.sh[domain,"cdn-{HOST.HOST}",,,15])<{$DOMAIN.EXPIRE.WARN} and last(/Favor-group site monitoring/ssl_cert_check.sh[domain,"cdn-{HOST.HOST}",,,15])<>-65535'
              name: 'Domain cdn-{HOST.HOST} expires in {ITEM.VALUE}'
              priority: HIGH
              description: 'The domain registration runs out soon, and with it the site and its mail. Renew it at the registrar; check the date with whois cdn-{HOST.HOST}.'
              tags:
                - tag: notify
                  value: admin
            - uuid: c5406bedde5c4af6a26226f89d331145
              expression: 'max(/Favor-group site monitoring/ssl_cert_check.sh[domain,"cdn-{HOST.HOST}",,,15],#4)=-65535'
              name: 'Domain expiry of cdn-{HOST.HOST} could not be read for a day'
              priority: WARNING
              description: 'whois returned no answer or no expiry date four times in a row (24 hours), so the registration date is not watched. Run the check by hand on the Zabbix server: ssl_cert_check.sh domain cdn-{HOST.HOST}.'
              tags:
                - tag: notify
                  value: admin
        - uuid: 72feeab898414fb1a4c652c12f81d352
          name: 'sitemap.xml newest entry age'
          type: EXTERNAL
          key: 'sitemap_check.sh["https://{HOST.HOST}/sitemap.xml"]'
          delay: 1h
          history: 90d
          units: d
          tags:
            - tag: Application
              value: Web
          triggers:
            - uuid: bd1ec252b16c46518945a221ec572d09
              expression: 'min(/Favor-group site monitoring/sitemap_check.sh["https://{HOST.HOST}/sitemap.xml"],#3)>3'
              name: 'Newest entry in sitemap.xml is >3 days old: {ITEM.VALUE}'
              url: 'https://{HOST.HOST}/sitemap.xml'
              priority: WARNING
              description: 'sitemap.xml should be renewed automatically, this alert means that either we have no updates to any page on the site or that automatic renewal is broken.'
      macros:
        - macro: '{$DOMAIN.EXPIRE.WARN}'
          value: '30'
          description: 'Days before the domain registration expires that raise the alert.'

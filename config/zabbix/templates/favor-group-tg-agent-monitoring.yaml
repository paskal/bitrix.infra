zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 95618eb1474e44ac91b00d5c9bc7e33a
      name: Favor-group
  templates:
    - uuid: 0ea120fe92364857b52696caed4eb02d
      template: 'Favor-group tg-agent monitoring'
      name: 'Favor-group tg-agent monitoring'
      description: 'Watches the unattended ads-cron claude -p runs of the tg-agent stack on terrty (favor-group.ru repo, tg-agent/). The host wrapper tg-agent/cron/ads-cron-run.sh pushes each run''s exit code via zabbix_sender. A failing run most often means the shared claude.ai login in the claude-auth volume expired — recovery is the interactive re-login documented in tg-agent/README.md.'
      groups:
        - name: Favor-group
      items:
        - uuid: 61f089b84d864ccf973660006730783d
          name: 'lead enrichment run exit code'
          type: TRAP
          key: leadenrich.status
          history: 90d
          description: 'Exit code of ~/lead-enrich/enrich_run.sh on terrty. 2 means codex produced nothing, which usually means it is logged out; the script fails loudly instead of reporting an innocent ''nothing to fill''.'
          triggers:
            - uuid: 7cd0624d6b314ce7acf797fa952aa834
              expression: 'nodata(/Favor-group tg-agent monitoring/leadenrich.status,10h)=1'
              name: 'lead enrichment has not reported for 10h'
              priority: WARNING
              description: 'Runs hourly 05:17-15:17 UTC (08:17-18:17 MSK) and once at 21:17 UTC (00:17 MSK) from the opc crontab, so the longest normal gap is the night one, eight hours plus the run time. Check `crontab -l` on terrty and ~/lead-enrich/enrich.log.'
        - uuid: aa899bcb1d9241b5a10ec8e33cbb2488
          name: 'lead enrichment last failure reason'
          type: TRAP
          key: leadenrich.reason
          history: 30d
          value_type: TEXT
          trends: '0'
          description: 'One line pushed by ~/lead-enrich/enrich_run.sh right before leadenrich.status: "ok" on exit 0, otherwise the last ERROR/LUNA_FAILED line of the run (codex usage limit with its reset time, "codex не авторизован", and so on). Shown in the failed-run alert through {ITEM.LASTVALUE2}, so the Telegram message says what broke instead of a bare exit code.'
          tags:
            - tag: Application
              value: tg-agent
        - uuid: f7b8dd02daee4cf6a708d8fc7579b5bd
          name: 'claude.ai login state on terrty (1 = logged out)'
          type: TRAP
          key: tgagent.claude.auth
          history: 90d
          description: 'Pushed every 30 min by tg-agent/cron/claude-auth-check.sh on terrty: `claude auth status --json` inside the agent-dmitry container, which shares the claude-auth volume with the other two Telegram bots and ads-cron. 0 = loggedIn true, 1 = logged out (OAuth session expired and could not be refreshed). A logged-out volume kills all three Telegram bots and every ads-cron run silently; recovery is the interactive re-login in tg-agent/README.md ("claude.ai session"). Added 25.08.2026 after three failed ads-cron runs (24-25.08) went unnoticed because the exit-code alert looked like any other tg-agent failure.'
          tags:
            - tag: Application
              value: tg-agent
          triggers:
            - uuid: 86e50fb30d5f4f8aad31b220ea4c19ca
              expression: 'last(/Favor-group tg-agent monitoring/tgagent.claude.auth)=1'
              name: 'CLAUDE.AI LOGIN EXPIRED on terrty: Telegram bots and ads-cron are dead until re-login'
              priority: DISASTER
              description: '`claude auth status` in the shared claude-auth volume reports loggedIn=false. Nothing that runs claude on terrty works until someone re-logs in: ssh -t terrty ''cd ~/favor-group/tg-agent && docker compose exec -it agent-dmitry claude'' -> /login, then docker compose up -d --force-recreate --no-deps agent-dmitry agent-aleksandr agent-maria. Clears automatically on the next 30-min check after the re-login.'
              tags:
                - tag: notify
                  value: admin
            - uuid: e85f7ce1a931432c91b776806f581494
              expression: 'nodata(/Favor-group tg-agent monitoring/tgagent.claude.auth,3h)=1'
              name: 'claude.ai login watchdog has not reported for 3h'
              priority: AVERAGE
              description: 'claude-auth-check.sh runs every 30 min from the opc crontab on terrty. Check crontab -l, docker ps (fg-agent-dmitry must be up) and tg-agent/data/ads-cron/auth-check.log.'
              manual_close: 'YES'
        - uuid: b3c6daf7c31444da8dcdaa57cf6a90f1
          name: 'tg-agent ads-cron run exit code'
          type: TRAP
          key: tgagent.adscron.status
          history: 90d
          description: 'Exit code of the latest ads-cron daily/weekly run (0 = report posted or correctly skipped as duplicate). Pushed by tg-agent/cron/ads-cron-run.sh on terrty after every run: daily at 21:00 UTC Monday-Friday and weekly at 15:00 UTC Monday (18:00 MSK). The longest normal silence is 66h (Friday 21:00 UTC -> Monday 15:00 UTC).'
          tags:
            - tag: Application
              value: tg-agent
          triggers:
            - uuid: 5e762b2c957f4d2ca18d46722ce57c97
              expression: 'nodata(/Favor-group tg-agent monitoring/tgagent.adscron.status,90h)=1'
              name: 'tg-agent ads-cron has not reported for 90h'
              priority: AVERAGE
              description: 'No exit-code push for over 90h. Normal max gap is 82.5h (Friday 04:30 UTC morning run -> Monday 15:00 UTC weekly). Raised from 70h on 2026-08-12 when the morning note moved from Tue-Sat 03:00 UTC to Mon-Fri 04:30 UTC: the old threshold fired every weekend. Check crontab -l and tg-agent/data/ads-cron/cron.log on terrty.'
              manual_close: 'YES'
            - uuid: 62cabf479eab4551b0aa78288a3f77c5
              expression: 'last(/Favor-group tg-agent monitoring/tgagent.adscron.status)<>0'
              name: 'tg-agent ads-cron run failed — check claude.ai login on terrty'
              priority: DISASTER
              description: 'The unattended ads report run exited non-zero. Most likely the shared claude.ai OAuth login in the favor-tg-agent_claude-auth volume expired (this also silently kills all three Telegram bots). Check tg-agent/data/ads-cron/cron.log on terrty; re-login per tg-agent/README.md (interactive claude session in any agent container). Clears on the next successful run.'
              manual_close: 'YES'
        - uuid: 9e4a5dd9f8b347cb9cf220046f0148a3
          name: 'Yandex OAuth tokens on terrty: rejected count'
          type: TRAP
          key: tgagent.yandex.tokens.invalid
          history: 90d
          description: 'Pushed daily by tg-agent/cron/yandex-token-check.py on terrty: how many TOKEN variables in tg-agent/secrets/yandex-*.env login.yandex.ru rejects (expired or revoked). Added 06.10.2026 after the expired YANDEX_METRIKA_TOKEN stopped the morning ads run with a 403.'
          tags:
            - tag: Application
              value: tg-agent
          triggers:
            - uuid: fb65c225a6ed426ba79f05e5852f0469
              expression: 'nodata(/Favor-group tg-agent monitoring/tgagent.yandex.tokens.invalid,2d)=1'
              name: 'Yandex token check has not reported for 2 days'
              priority: AVERAGE
              description: 'yandex-token-check.py runs daily from the opc crontab on terrty. Check crontab -l and tg-agent/data/token-check/check.log; exit 2 means Yandex could not be reached for any token.'
              manual_close: 'YES'
        - uuid: 540be40765d34e0c83be8de0d476cbb5
          name: 'Yandex OAuth tokens on terrty: fewest days left'
          type: TRAP
          key: tgagent.yandex.tokens.days_left
          history: 90d
          value_type: FLOAT
          units: d
          description: 'Fewest days left among valid tokens, counting 365 days from the day the check first saw each value (seeded from the oldest copy of the env file, backups included, that holds the same value, so the first figures are approximate). Yandex does not expose a token''s expiry date.'
          tags:
            - tag: Application
              value: tg-agent
        - uuid: b7f99d1155c3424d881e7bb59b12a7b9
          name: 'Yandex OAuth tokens on terrty: report'
          type: TRAP
          key: tgagent.yandex.tokens.report
          history: 30d
          value_type: TEXT
          trends: '0'
          description: 'One line per token: variable, env file, Yandex login, ok/invalid/unknown, date first seen, days left. Shown in the token alerts.'
          tags:
            - tag: Application
              value: tg-agent
  triggers:
    - uuid: 1e88984116144909bdbfbdf256824ea7
      expression: 'last(/Favor-group tg-agent monitoring/tgagent.yandex.tokens.invalid)>0 and length(last(/Favor-group tg-agent monitoring/tgagent.yandex.tokens.report))>=0'
      name: 'Yandex OAuth token rejected on terrty: renew it'
      opdata: '{ITEM.LASTVALUE2}'
      priority: HIGH
      description: 'A Yandex token in tg-agent/secrets/yandex-*.env is expired or revoked (the report line says which variable and file). Renew: open https://oauth.yandex.ru/authorize?response_type=token&client_id=c5e90f6082cd4baf8fbf28dfa947371c logged in as the Yandex account that owns the token (f.favor for Metrika and Webmaster, the ad login for a Direct token), copy access_token from the address after redirect, replace the value in that env file on terrty, then docker compose up -d --force-recreate --no-deps agent-dmitry agent-aleksandr agent-maria. Clears on the next daily check.'
      tags:
        - tag: notify
          value: admin
    - uuid: 573cd6005b58402fab901913e3f7274c
      expression: 'last(/Favor-group tg-agent monitoring/tgagent.yandex.tokens.days_left)<=7 and length(last(/Favor-group tg-agent monitoring/tgagent.yandex.tokens.report))>=0'
      name: 'Yandex OAuth token due for renewal within 7 days'
      opdata: '{ITEM.LASTVALUE2}'
      priority: WARNING
      description: 'A token on terrty is within a week of a year old. Renew it before it expires: https://oauth.yandex.ru/authorize?response_type=token&client_id=c5e90f6082cd4baf8fbf28dfa947371c, logged in as the owning Yandex account; replace the value in the env file named in the report and recreate the agents. The count restarts when the value changes.'
      tags:
        - tag: notify
          value: admin
    - uuid: e1d1b712bafa4fd0b7a243a0cf108eaf
      expression: 'last(/Favor-group tg-agent monitoring/leadenrich.status)<>0 and (last(/Favor-group tg-agent monitoring/leadenrich.status)<>3 or min(/Favor-group tg-agent monitoring/leadenrich.status,#2)=3) and length(last(/Favor-group tg-agent monitoring/leadenrich.reason))>=0'
      name: 'lead enrichment failed on terrty: {ITEM.LASTVALUE2}'
      opdata: '{ITEM.LASTVALUE2}'
      priority: AVERAGE
      description: 'Exit 2 = codex returned no answer. The reason item names the cause: "usage limit ... try again at HH:MM" means the ChatGPT quota is spent and the next run after that time recovers by itself, nothing to do; "codex не авторизован" means the token is revoked, run `codex login` on terrty as opc. Exit 3 = a B24 REST read (crm.activity.list) timed out; it alerts only when two runs in a row end with 3, because a single timeout cleared on the next run every time in September 2026 (9 of 9; decision 03.10.2026). Other non-zero codes: see ~/lead-enrich/enrich.log. The length() term only pulls leadenrich.reason into the trigger so {ITEM.LASTVALUE2} resolves.'

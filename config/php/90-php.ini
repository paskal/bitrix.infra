[php]
short_open_tag = On
display_errors = Off
expose_php = Off
allow_url_fopen = Off
error_log = "/var/log/php/error.log"
error_reporting = E_ALL
log_errors = On
display_startup_errors = On
cgi.fix_pathinfo = 0
date.timezone = "Europe/Moscow"
max_input_vars = 10000
max_execution_time = 60
post_max_size = 1024M
memory_limit = 1536M
upload_max_filesize = 1024M
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_trans_sid = 0
session.gc_maxlifetime = 10800
session.cookie_lifetime = 14400
; Bitrix hands sessions to this handler when bitrix/.settings.php sets
; 'general' => ['type' => 'save_handler.php.ini']. Bitrix's own 'memcache' session type needs the
; memcache extension, which the PHP 8.5 image does not ship; php-memcached has a native handler.
session.save_handler = memcached
session.save_path = "memcached-sessions:11211"
; a request waits up to about 7 s for a session another request of the same visitor holds;
; the default of 5 retries of 150 ms fails the session start after 0.75 s
memcached.sess_lock_wait_min = 50
memcached.sess_lock_wait_max = 150
memcached.sess_lock_retries = 50

[opcache]
opcache.jit = 1255
opcache.jit_buffer_size = 512M
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.max_accelerated_files = 100000
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.fast_shutdown = 1
opcache.error_log = "/var/log/php/opcache.log"

[mail function]
sendmail_path = "/usr/bin/msmtp -t"

map $http_user_agent $bad_agent {
    default 0;
    "~^.+ YandexSearch/.+" 0;
    "~^.+ YandexMetrika/.+" 0;
    # old Chrome which is Chrome responsive design check actually
    "Mozilla/5.0 (Linux; Android 8.0.0; SM-G955U Build/R16NW) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/87.0.4280.141 Mobile Safari/537.36" 0;
    "Mozilla/5.0 (Linux; Android 10; SM-G981B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/80.0.3987.162 Mobile Safari/537.36" 0;
    "Mozilla/5.0 (Linux; Android) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/88.0.4324.109 Safari/537.36 CrKey/1.54.248666" 0;
    "Mozilla/5.0 (X11; Linux aarch64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/88.0.4324.188 Safari/537.36 CrKey/1.54.250320" 0;
    # old Chrome which is Firefox responsive design check actually
    "Mozilla/5.0 (Linux; Android 11; SAMSUNG SM-G973U) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/14.2 Chrome/87.0.4280.141 Mobile Safari/537.36" 0;
    # old Chrome which is bots
    "~^.+ Chrome\/[45678]\d" 1;
    "Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:57.0) Gecko/20100101 Firefox/57.0" 1;
    ~^.+90.0.44.+ 1;
}

# Crawlers answered 403 by bots.conf rather than merely flagged as bots. The bar
# for an entry is deliberately high: the agent must identify itself as a bot (so
# no real visitor can ever match) and must either ignore robots.txt or bring no
# traffic worth the render cost. Search crawlers that obey robots.txt and send
# visitors (Yandex, Google, Bing, Mail.ru, 2GIS) never belong here.
map $http_user_agent $denied_agent {
    default 0;

    # Meta's AI-training and indexing crawlers. Measured over 2026-07-19..25 they
    # were 51% of all requests to the site (269k hits, 17 GB), and 180k of those
    # went to /auth/ and the captcha generator, which robots.txt has disallowed
    # for years and which Google, Yandex and Bing all honour. An agent that
    # ignores robots.txt is not negotiating in good faith, and Meta's platforms
    # are blocked in Russia, so the crawl returns no referrals either.
    "~*meta-externalagent" 1;
    "~*meta-webindexer" 1;

    # Same pattern at smaller scale: an AI-search indexer walking the disallowed
    # /auth/ tree.
    "~*LinkupBot" 1;
}

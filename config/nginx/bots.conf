## mark the bad actors
set $block 0;

if ($bad_agent) {
    set $block 1;
}

if ($bad_ip) {
    set $block 1;
}

if ($bad_referer) {
    set $block 1;
}
## end of block

## Refuse the sources listed in the $denied_ip (conf.d/bad_ips.conf) and
## $denied_agent (conf.d/useragents.conf) maps before they reach PHP. This file
## is included by the PHP locations only, so static assets stay served: the point
## is to stop unwanted traffic from occupying PHP-FPM workers, not to firewall
## the host. Both maps default to 0, so this is inert until something is listed.
if ($denied_ip) {
    return 403;
}

if ($denied_agent) {
    return 403;
}

